<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officina.ch — Karriereplattform für Apotheken</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --pine:#232323; --paper:#FFFFFF; --panel:#F7F8F6; --panel-highlight:#EAF7EC;
  --amber:#2E9E3F; --amber-dark:#237D33; --line:#E5E7E4; --text2:#62675F; --danger:#DC2626;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:#1F2421;font-family:'Inter',sans-serif;}
h1,h2,h3{font-family:'Inter',sans-serif;font-weight:700;margin:0;letter-spacing:-0.02em;}
a{color:#1F2421;text-decoration:none;cursor:pointer;}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;width:100%;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
button{cursor:pointer;font-family:inherit;border:none;background:none;}
.btn-primary{background:var(--amber);color:#fff;border:none;border-radius:8px;padding:12px 22px;font-size:14px;font-weight:700;display:inline-block;}
.btn-primary:hover{background:var(--amber-dark);}
.btn-primary:disabled{opacity:0.6;}
.btn-ghost{background:transparent;color:#1F2421;border:1px solid var(--line);border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;display:inline-block;}
.btn-ghost:hover{border-color:#1F2421;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:#3F453F;display:inline-block;}
.tag.accent{border-color:var(--amber);color:var(--amber-dark);background:var(--panel-highlight);}
.container{max-width:1080px;margin:0 auto;padding:0 32px;}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text2);margin-bottom:14px;}
header.topbar{background:var(--pine);position:sticky;top:0;z-index:20;}
header.topbar .row{padding:10px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1080px;margin:0 auto;}
header.topbar a.logo{font-weight:800;font-size:17px;color:#fff;flex-shrink:0;}
header.topbar a.logo span{color:var(--amber);}
nav.navlinks{display:flex;gap:18px;flex:1;margin-left:24px;flex-wrap:wrap;}
nav.navlinks a{color:#fff;font-size:14.5px;font-weight:600;padding:6px 2px;border-bottom:2px solid transparent;}
nav.navlinks a.active{color:var(--amber);border-bottom:2px solid var(--amber);}
.navright{display:flex;gap:10px;align-items:center;flex-shrink:0;}
.job-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 4px;border-bottom:1px solid var(--line);}
.job-row:hover{background:var(--panel);}
#app{min-height:60vh;}
footer{padding:24px 32px;font-size:12.5px;color:var(--text2);text-align:center;}
.msg{font-size:13px;margin-bottom:12px;}
.msg.error{color:var(--danger);}
.msg.ok{color:var(--amber-dark);}
</style>
</head>
<body>

<header class="topbar">
  <div class="row">
    <a href="#/" class="logo">OFFICINA<span>.CH</span></a>
    <nav class="navlinks" id="navlinks"></nav>
    <div class="navright" id="navright"></div>
  </div>
</header>

<div id="app" class="container" style="padding:40px 32px 80px;"></div>

<footer>Officina.ch — Karriereplattform für Apotheken Schweiz</footer>

<script>
const SUPABASE_URL = "https://zeliherrtisicijdgvuh.supabase.co";
const SUPABASE_KEY = "sb_publishable_zrNIQFWU7WOXC-w72kRBFA_Bzkn8505";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CANTONS = [
  {code:"ZH",name:"Zürich"},{code:"BE",name:"Bern"},{code:"LU",name:"Luzern"},{code:"UR",name:"Uri"},
  {code:"SZ",name:"Schwyz"},{code:"OW",name:"Obwalden"},{code:"NW",name:"Nidwalden"},{code:"GL",name:"Glarus"},
  {code:"ZG",name:"Zug"},{code:"FR",name:"Freiburg"},{code:"SO",name:"Solothurn"},{code:"BS",name:"Basel-Stadt"},
  {code:"BL",name:"Basel-Landschaft"},{code:"SH",name:"Schaffhausen"},{code:"AR",name:"Appenzell Ausserrhoden"},
  {code:"AI",name:"Appenzell Innerrhoden"},{code:"SG",name:"St. Gallen"},{code:"GR",name:"Graubünden"},
  {code:"AG",name:"Aargau"},{code:"TG",name:"Thurgau"},{code:"TI",name:"Tessin"},{code:"VD",name:"Waadt"},
  {code:"VS",name:"Wallis"},{code:"NE",name:"Neuenburg"},{code:"GE",name:"Genf"},{code:"JU",name:"Jura"},
];
const PROFESSIONS = [
  {key:"apotheker",label:"Apotheker:in"},
  {key:"pharma_assistent",label:"Pharma-Assistent:in"},
  {key:"praktikum",label:"Praktikum"},
];
function profLabel(k){ const p = PROFESSIONS.find(p=>p.key===k); return p ? p.label : k; }
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cantonOptions(selected){
  return CANTONS.map(c => `<option value="${c.code}" ${c.code===selected?"selected":""}>${c.name}</option>`).join("");
}

let currentSession = null;
let currentProfile = null;

async function refreshSession(){
  const { data } = await sb.auth.getSession();
  currentSession = data.session;
  if (currentSession) {
    const { data: prof } = await sb.from("profiles").select("*").eq("id", currentSession.user.id).single();
    currentProfile = prof;
  } else {
    currentProfile = null;
  }
  renderNav();
}

function renderNav(){
  const links = [
    ["#/", "Jobs"],
    ["#/profile", "Profil erstellen"],
    ["#/pricing", "Preise"],
  ];
  if (currentProfile && currentProfile.role === "candidate") {
    links.push(["#/favorites", "Favoriten"]);
    links.push(["#/my-applications", "Meine Bewerbungen"]);
  }
  if (currentProfile && currentProfile.role === "employer") {
    links.push(["#/employer-dashboard", "Dashboard"]);
  }
  if (currentProfile && currentProfile.role === "admin") {
    links.push(["#/admin", "Admin"]);
  }
  const hash = location.hash || "#/";
  document.getElementById("navlinks").innerHTML = links.map(([href,label]) =>
    `<a href="${href}" class="${hash===href?'active':''}">${label}</a>`
  ).join("");

  const right = document.getElementById("navright");
  if (currentSession) {
    right.innerHTML = `<button class="btn-primary" style="padding:8px 16px;font-size:13px;" onclick="logout()">Abmelden</button>`;
  } else {
    right.innerHTML = `<a href="#/login" class="btn-primary" style="padding:8px 16px;font-size:13px;">Login</a>`;
  }
}

async function logout(){
  await sb.auth.signOut();
  await refreshSession();
  location.hash = "#/";
}

function setApp(html){ document.getElementById("app").innerHTML = html; }

/* ---------------- HOME / JOB LIST ---------------- */
let allJobs = [];
async function viewHome(){
  setApp(`
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:40px 32px;margin:-8px 0 30px;">
      <div style="display:flex;gap:40px;flex-wrap:wrap;">
        <div style="flex:1 1 300px;">
          <div style="font-size:15px;color:var(--text2);">Ich suche</div>
          <div style="font-size:28px;font-weight:800;margin-bottom:16px;">einen Job</div>
          <a href="#/" class="btn-primary" style="margin-right:10px;">Offene Stellen</a>
          <a href="#/profile" class="btn-ghost">Profil erstellen</a>
        </div>
        <div style="flex:1 1 300px;">
          <div style="font-size:15px;color:var(--text2);">Ich suche</div>
          <div style="font-size:28px;font-weight:800;margin-bottom:16px;">Personal</div>
          <a href="#/post-job" class="btn-primary" style="margin-right:10px;">Inserat aufgeben</a>
          <a href="#/pricing" class="btn-ghost">Zugang &amp; Preise</a>
        </div>
      </div>
    </div>
    <h2 style="font-size:22px;margin-bottom:4px;">Neuste Stelleninserate</h2>
    <div style="width:46px;height:3px;background:var(--amber);margin-bottom:24px;"></div>
    <div class="panel" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;">
      <input id="q-search" placeholder="Titel, Betrieb oder Ort suchen…" style="flex:2;min-width:180px;" oninput="filterJobs()">
      <select id="q-canton" style="flex:1;" onchange="filterJobs()">
        <option value="all">Alle Kantone</option>${cantonOptions()}
      </select>
      <select id="q-profession" style="flex:1;" onchange="filterJobs()">
        <option value="all">Alle Rollen</option>
        ${PROFESSIONS.map(p=>`<option value="${p.key}">${p.label}</option>`).join("")}
      </select>
    </div>
    <div id="job-list">Lade Stellen…</div>
  `);
  const { data, error } = await sb.from("jobs")
    .select("id,title,profession,canton,place,employment_type,is_springer,springer_duration,status,companies(name,verified)")
    .eq("status","published")
    .order("created_at",{ascending:false});
  allJobs = (data || []).filter(j => j); 
  filterJobs();
}
function filterJobs(){
  const q = (document.getElementById("q-search")?.value || "").toLowerCase();
  const canton = document.getElementById("q-canton")?.value || "all";
  const prof = document.getElementById("q-profession")?.value || "all";
  const filtered = allJobs.filter(j => {
    const matchQ = !q || `${j.title} ${j.companies?.name||""} ${j.place||""}`.toLowerCase().includes(q);
    const matchC = canton==="all" || j.canton===canton;
    const matchP = prof==="all" || j.profession===prof;
    return matchQ && matchC && matchP;
  });
  const list = document.getElementById("job-list");
  if (!list) return;
  if (filtered.length === 0) {
    list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);border-style:dashed;">Keine Stellen gefunden. Sobald Arbeitgeber Inserate veröffentlichen, erscheinen sie hier.</div>`;
    return;
  }
  list.innerHTML = filtered.map(j => `
    <a href="#/job/${j.id}">
      <div class="job-row">
        <div>
          <div style="font-size:16px;font-weight:700;">${esc(j.title)}</div>
          <div style="font-size:13.5px;color:var(--text2);">${esc(j.companies?.name||"")}</div>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <span style="font-size:13.5px;color:var(--text2);">${esc(j.place||"")} (${esc(j.canton||"")})</span>
          ${j.companies?.verified ? '<span class="tag accent" style="font-size:11px;">✓ verifiziert</span>' : ''}
          <span style="color:var(--amber);font-weight:700;">→</span>
        </div>
      </div>
    </a>
  `).join("");
}

/* ---------------- JOB DETAIL ---------------- */
async function viewJobDetail(id){
  setApp(`<div>Lade…</div>`);
  const { data: job } = await sb.from("jobs").select("*, companies(name,canton,place,verified)").eq("id", id).single();
  if (!job) { setApp(`<div class="panel">Stelle nicht gefunden. <a href="#/">Zurück</a></div>`); return; }
  setApp(`
    <div class="panel" style="max-width:720px;">
      <h1 style="font-size:26px;margin-bottom:6px;">${esc(job.title)}</h1>
      <div style="font-size:15px;color:#31463D;margin-bottom:14px;">${esc(job.companies?.name||"")} · ${esc(job.place||"")} (${esc(job.canton||"")})</div>
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <span class="tag">${esc(job.employment_type||"")}</span>
        ${job.companies?.verified ? '<span class="tag accent">✓ verifizierter Betrieb</span>' : ''}
      </div>
      <p style="font-size:15px;line-height:1.7;white-space:pre-wrap;margin-bottom:24px;">${esc(job.description||"")}</p>
      <div id="apply-area"></div>
    </div>
  `);
  const applyArea = document.getElementById("apply-area");
  if (!currentSession) {
    applyArea.innerHTML = `<p style="font-size:14px;margin-bottom:12px;">Melde dich an, um dich zu bewerben.</p><a href="#/login" class="btn-primary">Zum Login</a>`;
    return;
  }
  applyArea.innerHTML = `
    <div class="field">Kurze Nachricht (optional)<textarea id="apply-note" rows="4"></textarea></div>
    <button class="btn-primary" onclick="applyToJob('${id}')">Mit einem Klick bewerben</button>
    <div id="apply-status" class="msg"></div>
  `;
}
async function applyToJob(jobId){
  const note = document.getElementById("apply-note").value;
  const { error } = await sb.from("applications").insert({ job_id: jobId, candidate_id: currentSession.user.id, cover_note: note });
  const statusEl = document.getElementById("apply-status");
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  statusEl.className="msg ok"; statusEl.textContent = "✓ Bewerbung gesendet.";
}

/* ---------------- REGISTER ---------------- */
function viewRegister(){
  setApp(`
    <div class="panel" style="max-width:420px;">
      <h1 style="font-size:22px;margin-bottom:18px;">Registrieren</h1>
      <div class="field">Ich bin…
        <select id="reg-role"><option value="candidate">Bewerber:in</option><option value="employer">Arbeitgeber</option></select>
      </div>
      <div class="field">E-Mail<input id="reg-email" type="email" placeholder="name@beispiel.ch"></div>
      <div class="field">Passwort<input id="reg-password" type="password" placeholder="mind. 6 Zeichen"></div>
      <div id="reg-status" class="msg"></div>
      <button class="btn-primary" onclick="doRegister()">Konto erstellen</button>
    </div>
  `);
}
async function doRegister(){
  const role = document.getElementById("reg-role").value;
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;
  const statusEl = document.getElementById("reg-status");
  statusEl.className="msg"; statusEl.textContent="Wird erstellt…";
  const { error } = await sb.auth.signUp({ email, password, options: { data: { role } } });
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  await refreshSession();
  statusEl.className="msg ok"; statusEl.textContent = "Konto erstellt!";
  location.hash = role === "employer" ? "#/company" : "#/profile";
}

/* ---------------- LOGIN ---------------- */
function viewLogin(){
  setApp(`
    <div class="panel" style="max-width:400px;">
      <h1 style="font-size:22px;margin-bottom:18px;">Anmelden</h1>
      <div class="field">E-Mail<input id="log-email" type="email"></div>
      <div class="field">Passwort<input id="log-password" type="password"></div>
      <div id="log-status" class="msg"></div>
      <button class="btn-primary" onclick="doLogin()">Login</button>
    </div>
  `);
}
async function doLogin(){
  const email = document.getElementById("log-email").value;
  const password = document.getElementById("log-password").value;
  const statusEl = document.getElementById("log-status");
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  await refreshSession();
  location.hash = "#/";
}

/* ---------------- PROFILE (candidate) ---------------- */
async function viewProfile(){
  if (!currentSession) {
    setApp(`
      <div class="panel" style="max-width:460px;">
        <h1 style="font-size:22px;margin-bottom:14px;">Profil erstellen</h1>
        <p style="font-size:14px;margin-bottom:16px;">Melde dich an oder registriere dich, um dein Profil anzulegen.</p>
        <a href="#/register" class="btn-primary">Jetzt registrieren</a>
      </div>
    `);
    return;
  }
  const p = currentProfile || {};
  setApp(`
    <div class="panel" style="max-width:520px;">
      <h1 style="font-size:22px;margin-bottom:18px;">Mein Profil</h1>
      <div style="display:flex;gap:12px;">
        <div class="field" style="flex:1;">Vorname<input id="p-first" value="${esc(p.first_name||"")}"></div>
        <div class="field" style="flex:1;">Nachname<input id="p-last" value="${esc(p.last_name||"")}"></div>
      </div>
      <div style="display:flex;gap:12px;">
        <div class="field" style="flex:1;">Rolle
          <select id="p-profession">
            <option value="">—</option>
            ${PROFESSIONS.map(pr=>`<option value="${pr.key}" ${p.profession===pr.key?"selected":""}>${pr.label}</option>`).join("")}
          </select>
        </div>
        <div class="field" style="flex:1;">Kanton
          <select id="p-canton"><option value="">—</option>${cantonOptions(p.canton)}</select>
        </div>
      </div>
      <div class="field">Lebenslauf (PDF)<input id="p-cv" type="file" accept="application/pdf">
        ${p.cv_url ? `<a href="${p.cv_url}" target="_blank" style="font-size:13px;">Aktuellen Lebenslauf ansehen</a>` : ""}
      </div>
      <div id="p-status" class="msg"></div>
      <button class="btn-primary" onclick="saveProfile()">Profil speichern</button>
    </div>
  `);
}
async function saveProfile(){
  const statusEl = document.getElementById("p-status");
  statusEl.className="msg"; statusEl.textContent="Speichert…";
  let cv_url = currentProfile?.cv_url || null;
  const file = document.getElementById("p-cv").files[0];
  if (file) {
    const path = `${currentSession.user.id}/${file.name}`;
    const { error: upErr } = await sb.storage.from("resumes").upload(path, file, { upsert: true });
    if (upErr) { statusEl.className="msg error"; statusEl.textContent = upErr.message; return; }
    const { data: pub } = sb.storage.from("resumes").getPublicUrl(path);
    cv_url = pub.publicUrl;
  }
  const { error } = await sb.from("profiles").update({
    first_name: document.getElementById("p-first").value,
    last_name: document.getElementById("p-last").value,
    profession: document.getElementById("p-profession").value,
    canton: document.getElementById("p-canton").value,
    cv_url,
  }).eq("id", currentSession.user.id);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  await refreshSession();
  statusEl.className="msg ok"; statusEl.textContent = "✓ Profil gespeichert.";
}

/* ---------------- COMPANY ---------------- */
async function viewCompany(){
  if (!currentSession) { location.hash = "#/login"; return; }
  const { data: comp } = await sb.from("companies").select("*").eq("owner_id", currentSession.user.id).maybeSingle();
  setApp(`
    <div class="panel" style="max-width:520px;">
      <h1 style="font-size:22px;margin-bottom:18px;">Firmenprofil</h1>
      <div class="field">Name der Apotheke<input id="c-name" value="${esc(comp?.name||"")}"></div>
      <div style="display:flex;gap:12px;">
        <div class="field" style="flex:1;">Ort<input id="c-place" value="${esc(comp?.place||"")}"></div>
        <div class="field" style="width:160px;">Kanton<select id="c-canton">${cantonOptions(comp?.canton||"ZH")}</select></div>
      </div>
      <div class="field">Beschreibung<textarea id="c-desc" rows="4">${esc(comp?.description||"")}</textarea></div>
      <div id="c-status" class="msg"></div>
      <button class="btn-primary" onclick="saveCompany('${comp?.id||""}')">Speichern</button>
    </div>
  `);
}
async function saveCompany(existingId){
  const statusEl = document.getElementById("c-status");
  const payload = {
    owner_id: currentSession.user.id,
    name: document.getElementById("c-name").value,
    place: document.getElementById("c-place").value,
    canton: document.getElementById("c-canton").value,
    description: document.getElementById("c-desc").value,
  };
  if (existingId) payload.id = existingId;
  const { error } = await sb.from("companies").upsert(payload, existingId ? { onConflict: "id" } : undefined);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  location.hash = "#/post-job";
}

/* ---------------- POST JOB ---------------- */
async function viewPostJob(){
  if (!currentSession) {
    setApp(`
      <div class="panel" style="max-width:460px;">
        <h1 style="font-size:22px;margin-bottom:14px;">Stelle inserieren</h1>
        <p style="font-size:14px;margin-bottom:16px;">Um eine Stelle zu veröffentlichen, brauchst du ein Arbeitgeber-Konto.</p>
        <a href="#/login" class="btn-ghost" style="margin-right:10px;">Login</a>
        <a href="#/register" class="btn-primary">Konto erstellen</a>
      </div>
    `);
    return;
  }
  const { data: comp } = await sb.from("companies").select("id").eq("owner_id", currentSession.user.id).maybeSingle();
  if (!comp) {
    setApp(`
      <div class="panel" style="max-width:460px;">
        <h1 style="font-size:22px;margin-bottom:14px;">Stelle inserieren</h1>
        <p style="font-size:14px;margin-bottom:16px;">Bevor du eine Stelle veröffentlichst, richte kurz dein Firmenprofil ein.</p>
        <a href="#/company" class="btn-primary">Firmenprofil erstellen</a>
      </div>
    `);
    return;
  }
  setApp(`
    <div class="panel" style="max-width:560px;">
      <h1 style="font-size:22px;margin-bottom:6px;">Stelle erstellen</h1>
      <p style="font-size:13px;color:var(--text2);margin-bottom:18px;">Deine Stelle ist sofort nach dem Absenden auf der Startseite sichtbar.</p>
      <div class="field">Stellentitel<input id="j-title" placeholder="z. B. Pharma-Assistent:in 80%"></div>
      <div style="display:flex;gap:12px;">
        <div class="field" style="flex:1;">Rolle
          <select id="j-profession">${PROFESSIONS.map(p=>`<option value="${p.key}">${p.label}</option>`).join("")}</select>
        </div>
        <div class="field" style="width:160px;">Kanton<select id="j-canton">${cantonOptions("ZH")}</select></div>
      </div>
      <div class="field">Ort<input id="j-place"></div>
      <div class="field">Anstellungsart
        <select id="j-type"><option>Festanstellung</option><option>Teilzeit</option><option>Praktikum</option></select>
      </div>
      <div class="field">Beschreibung<textarea id="j-desc" rows="5"></textarea></div>
      <div id="j-status" class="msg"></div>
      <button class="btn-primary" onclick="submitJob('${comp.id}')">Stelle veröffentlichen</button>
    </div>
  `);
}
async function submitJob(companyId){
  const statusEl = document.getElementById("j-status");
  const payload = {
    company_id: companyId,
    title: document.getElementById("j-title").value,
    profession: document.getElementById("j-profession").value,
    canton: document.getElementById("j-canton").value,
    place: document.getElementById("j-place").value,
    employment_type: document.getElementById("j-type").value,
    description: document.getElementById("j-desc").value,
    status: "published",
  };
  if (!payload.title || !payload.place) { statusEl.className="msg error"; statusEl.textContent = "Titel und Ort ausfüllen."; return; }
  const { error } = await sb.from("jobs").insert(payload);
  if (error) { statusEl.className="msg error"; statusEl.textContent = error.message; return; }
  statusEl.className="msg ok"; statusEl.textContent = "✓ Veröffentlicht!";
  setTimeout(() => location.hash = "#/", 800);
}

/* ---------------- PRICING ---------------- */
function viewPricing(){
  const tiers = [
    {name:"Einzelinserat", price:290, period:"Laufzeit: 9 Wochen", features:["1 Inserat inklusive","Laufzeit Inserat: 9 Wochen","Bewerbungen im Dashboard"]},
    {name:"Pro", price:690, period:"Laufzeit: 1 Jahr", features:["Bis zu 5 Inserate","Hervorgehobenes Listing","Chat mit Bewerbenden"], highlight:true},
    {name:"Unlimited", price:1490, period:"Laufzeit: 1 Jahr", features:["Unbegrenzte Inserate","Premium-Firmenprofil","Zugriff auf Springer-Pool"]},
  ];
  setApp(`
    <h1 style="font-size:26px;margin-bottom:4px;">Preise für Arbeitgeber</h1>
    <p style="font-size:14.5px;color:var(--text2);margin-bottom:30px;">Wähle das Paket, das zu deinem Personalbedarf passt.</p>
    <div style="display:flex;gap:20px;flex-wrap:wrap;">
      ${tiers.map(t => `
        <div style="flex:1 1 260px;background:${t.highlight?'var(--panel-highlight)':'#fff'};border:1px solid ${t.highlight?'#CBEBD1':'var(--line)'};border-radius:14px;padding:28px;">
          <div style="font-size:20px;font-weight:700;margin-bottom:18px;text-align:center;">${t.name}</div>
          <div style="text-align:center;"><span style="font-size:14px;font-weight:700;color:var(--text2);">CHF </span><span style="font-size:34px;font-weight:800;">${t.price}</span></div>
          <div style="text-align:center;font-size:12.5px;color:var(--text2);margin-bottom:20px;">${t.period}</div>
          <a href="#/post-job" class="btn-primary" style="width:100%;text-align:center;display:block;margin-bottom:24px;">Auswählen</a>
          <div style="border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px;font-size:14px;">
            ${t.features.map(f=>`<div style="display:flex;gap:10px;"><span style="color:var(--amber);font-weight:700;">★</span>${f}</div>`).join("")}
          </div>
        </div>
      `).join("")}
    </div>
  `);
}

/* ---------------- FAVORITES ---------------- */
async function viewFavorites(){
  if (!currentSession) { setApp(`<div class="panel" style="max-width:420px;"><p style="margin-bottom:16px;">Melde dich an, um Favoriten zu sehen.</p><a href="#/login" class="btn-primary">Zum Login</a></div>`); return; }
  setApp(`<h1 style="font-size:26px;margin-bottom:20px;">Favoriten</h1><div id="fav-list">Lade…</div>`);
  const { data } = await sb.from("favorites").select("job_id, jobs(id,title,place,canton,companies(name))").eq("candidate_id", currentSession.user.id);
  const list = document.getElementById("fav-list");
  if (!data || data.length === 0) { list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);">Noch keine Favoriten gespeichert.</div>`; return; }
  list.innerHTML = data.filter(f=>f.jobs).map(f => `
    <a href="#/job/${f.jobs.id}"><div class="panel" style="margin-bottom:12px;"><div style="font-weight:700;">${esc(f.jobs.title)}</div><div style="font-size:13px;color:var(--text2);">${esc(f.jobs.companies?.name||"")} · ${esc(f.jobs.place||"")} (${esc(f.jobs.canton||"")})</div></div></a>
  `).join("");
}

/* ---------------- MY APPLICATIONS ---------------- */
async function viewMyApplications(){
  if (!currentSession) { setApp(`<div class="panel" style="max-width:420px;"><p style="margin-bottom:16px;">Melde dich an, um deine Bewerbungen zu sehen.</p><a href="#/login" class="btn-primary">Zum Login</a></div>`); return; }
  setApp(`<h1 style="font-size:26px;margin-bottom:20px;">Meine Bewerbungen</h1><div id="app-list">Lade…</div>`);
  const { data } = await sb.from("applications").select("*, jobs(title,place,canton,companies(name))").eq("candidate_id", currentSession.user.id).order("created_at",{ascending:false});
  const list = document.getElementById("app-list");
  const labels = {new:"Neu",review:"In Prüfung",interview:"Interview",rejected:"Abgelehnt",hired:"Eingestellt"};
  if (!data || data.length === 0) { list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);">Noch keine Bewerbungen gesendet.</div>`; return; }
  list.innerHTML = data.map(a => `
    <div class="panel" style="margin-bottom:12px;">
      <div style="font-weight:700;">${esc(a.jobs?.title||"")}</div>
      <div style="font-size:13px;color:var(--text2);">${esc(a.jobs?.companies?.name||"")} · ${esc(a.jobs?.place||"")} (${esc(a.jobs?.canton||"")})</div>
      <span class="tag" style="margin-top:8px;">${labels[a.status]||a.status}</span>
    </div>
  `).join("");
}

/* ---------------- EMPLOYER DASHBOARD ---------------- */
async function viewEmployerDashboard(){
  if (!currentSession) { location.hash = "#/login"; return; }
  const { data: comp } = await sb.from("companies").select("*").eq("owner_id", currentSession.user.id).maybeSingle();
  if (!comp) { location.hash = "#/company"; return; }
  const { data: jobs } = await sb.from("jobs").select("*").eq("company_id", comp.id).order("created_at",{ascending:false});
  setApp(`
    <h1 style="font-size:26px;margin-bottom:6px;">${esc(comp.name)}</h1>
    <div style="font-size:14px;color:var(--text2);margin-bottom:24px;">${esc(comp.place||"")} (${esc(comp.canton||"")})</div>
    <a href="#/post-job" class="btn-primary" style="margin-bottom:24px;display:inline-block;">+ Stelle erstellen</a>
    <div>
      ${(jobs||[]).map(j => `
        <div class="panel" style="margin-bottom:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <div>
            <div style="font-weight:700;">${esc(j.title)}</div>
            <div style="font-size:13px;color:var(--text2);">Status: ${j.status==="published"?"Veröffentlicht":j.status==="pending"?"Wartet auf Freischaltung":"Geschlossen"}</div>
          </div>
        </div>
      `).join("") || `<div class="panel" style="text-align:center;color:var(--text2);">Noch keine Inserate.</div>`}
    </div>
  `);
}

/* ---------------- ADMIN ---------------- */
async function viewAdmin(){
  if (!currentProfile || currentProfile.role !== "admin") { setApp(`<div class="panel">Kein Zugriff.</div>`); return; }
  setApp(`<h1 style="font-size:26px;margin-bottom:20px;">Admin — Inserate freischalten</h1><div id="admin-list">Lade…</div>`);
  const { data } = await sb.from("jobs").select("*, companies(name)").eq("status","pending").order("created_at",{ascending:false});
  const list = document.getElementById("admin-list");
  if (!data || data.length === 0) { list.innerHTML = `<div class="panel" style="text-align:center;color:var(--text2);">Keine Inserate zur Prüfung.</div>`; return; }
  list.innerHTML = data.map(j => `
    <div class="panel" style="margin-bottom:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;">
      <div><div style="font-weight:700;">${esc(j.title)}</div><div style="font-size:13px;color:var(--text2);">${esc(j.companies?.name||"")} · ${esc(j.place||"")} (${esc(j.canton||"")})</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" onclick="publishJob('${j.id}')">Freischalten</button>
        <button class="btn-ghost" onclick="rejectJob('${j.id}')">Ablehnen</button>
      </div>
    </div>
  `).join("");
}
async function publishJob(id){ await sb.from("jobs").update({status:"published"}).eq("id",id); viewAdmin(); }
async function rejectJob(id){ await sb.from("jobs").update({status:"closed"}).eq("id",id); viewAdmin(); }

/* ---------------- ROUTER ---------------- */
async function router(){
  renderNav();
  const hash = location.hash || "#/";
  const jobMatch = hash.match(/^#\/job\/(.+)$/);
  if (hash === "#/" || hash === "") await viewHome();
  else if (jobMatch) await viewJobDetail(jobMatch[1]);
  else if (hash === "#/register") viewRegister();
  else if (hash === "#/login") viewLogin();
  else if (hash === "#/profile") await viewProfile();
  else if (hash === "#/company") await viewCompany();
  else if (hash === "#/post-job") await viewPostJob();
  else if (hash === "#/pricing") viewPricing();
  else if (hash === "#/favorites") await viewFavorites();
  else if (hash === "#/my-applications") await viewMyApplications();
  else if (hash === "#/employer-dashboard") await viewEmployerDashboard();
  else if (hash === "#/admin") await viewAdmin();
  else setApp(`<div class="panel">Seite nicht gefunden. <a href="#/">Zurück zur Startseite</a></div>`);
}

window.addEventListener("hashchange", router);
(async function init(){
  await refreshSession();
  router();
})();
</script>
